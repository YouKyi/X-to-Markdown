# Verify on every push; submit to AMO on a version tag.
#
# Releases (ci-catalog auto-release v5): on every push to main, CI keeps the
# release/next branch and its "chore(release): X.Y.Z" merge request up to date
# (CHANGELOG.md and package.json), never set to auto-merge. A human merges it;
# the next main pipeline tags its head vX.Y.Z, signed with the CI release key
# (SSH). On the tag, catalog:release-provenance checks the signature before
# anything is submitted. Never push to release/next: notes go under
# [Unreleased] in CHANGELOG.md, through a regular merge request. A tag signed by
# hand is checked the same way: OpenPGP against release-signers.asc, SSH
# against allowed_signers.
#
# Runner requirements: a Docker executor, or any runner with Node 24+ available.
# Node 24 is not optional - tests run .ts files directly via native type
# stripping, so an older runtime cannot execute the suite at all.
#
# CI/CD variables to set (Settings → CI/CD → Variables), both **Masked** and
# **Protected** so they are only exposed to protected tags:
#
#   RELEASE_TOKEN        release-bot personal token (api), environment release
#   RELEASE_SIGNING_KEY  CI release key (SSH, base64), environment release
#
#   AMO_JWT_ISSUER   AMO JWT issuer (Developer Hub → Manage API Keys), environment amo
#   AMO_JWT_SECRET   the matching secret, environment amo
#
# Protect your version tags (Settings → Repository → Protected tags, pattern `v*`)
# or the secrets will not be available to the sign job - and, more importantly,
# anyone able to push an unprotected tag could otherwise submit a release.

stages:
  - verify
  - sign
  - release

include:
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/gitleaks-scan@v5.0.0
    inputs:
      stage: verify
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/ggshield-scan@v5.0.0
    inputs:
      stage: verify
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/trivy-vuln@v5.0.0
    inputs:
      stage: verify
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/trivy-secret@v5.0.0
    inputs:
      stage: verify
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/trivy-license@v5.0.0
    inputs:
      stage: verify
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/auto-release@v5.0.0
    inputs:
      version_files: package.json
      gpg_public_keys: release-signers.asc
      tag_needs:
        - { job: check, artifacts: false }
        - { job: 'catalog:gitleaks-scan', artifacts: false }
        - { job: 'catalog:ggshield-scan', artifacts: false }
        - { job: 'catalog:trivy-vuln', artifacts: false }
        - { job: 'catalog:trivy-secret', artifacts: false }
        - { job: 'catalog:trivy-license', artifacts: false }

# An open MR already verifies the push in its own pipeline. The release commit
# reaches release/* before its MR exists: the MR pipeline is enough.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

default:
  image: node:26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
  before_script:
    # node:alpine ships no git, and the docker executor clones with a separate
    # helper image - so the job has a .git directory but no binary to read it
    # with. tools/check-hygiene.mjs asks git which files are tracked, which is
    # the only way to scan the repository without also scanning node_modules
    # and dist.
    - apk add --no-cache git
    # npm rather than corepack, which Node no longer bundles from v25 on.
    - npm install -g --no-fund --no-audit pnpm@11.11.0
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

variables:
  PNPM_HOME: /root/.pnpm
  # Keep the store inside the workspace so the cache above actually catches it.
  npm_config_store_dir: .pnpm-store

# typecheck + 226 tests + build + web-ext lint. The same gate that runs locally.
check:
  stage: verify
  rules:
    - when: on_success
  script:
    - pnpm check
  artifacts:
    when: on_failure
    paths:
      - dist/
    expire_in: 1 day

# Guards against the single most common release mistake: tagging without
# bumping. AMO rejects a version it has already seen, and it does so after the
# upload rather than before, so catching it here is cheaper.
version-matches-tag:
  stage: verify
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - apk add --no-cache jq
    - PKG=$(jq -r .version package.json)
    - TAG=${CI_COMMIT_TAG#v}
    - test "$PKG" = "$TAG" || { echo "tag $CI_COMMIT_TAG does not match package.json $PKG"; exit 1; }
    - echo "version $PKG"

# No needs here, on purpose: sign waits for every earlier stage, including
# catalog:release-provenance in .pre. A tag whose signature is refused stops
# the pipeline before anything reaches AMO.
sign:
  stage: sign
  rules:
    - if: $CI_COMMIT_TAG
  # The only job that reads AMO_JWT_*, scoped to this environment: they reach
  # no other job, check included. prepare records no deployment.
  environment:
    name: amo
    action: prepare
  script:
    - pnpm build
    # --approval-timeout=0 submits and exits. On the listed channel review is
    # human and can take days; a CI job must not sit waiting for it. The signed
    # XPI is published by AMO once approved, and existing users update
    # automatically - nothing here needs to hold the file.
    - >
      pnpm exec web-ext sign
      --source-dir=dist
      --artifacts-dir=artifacts
      --channel=listed
      --approval-timeout=0
      --no-input
      --api-key="$AMO_JWT_ISSUER"
      --api-secret="$AMO_JWT_SECRET"
  artifacts:
    paths:
      - artifacts/
    expire_in: 90 days
